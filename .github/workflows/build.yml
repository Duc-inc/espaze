name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # main.go embeds frontend/dist at compile time, so even a plain
      # `go vet`/`go build` needs it to exist - it's gitignored and only
      # produced by the frontend build, never checked in.
      - name: Build frontend assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build (compile check only)
        run: go build ./...

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: espaze-windows
            artifact-path: build/bin/*.exe
            build-flags: -nsis
          - os: macos-latest
            artifact-name: espaze-macos
            artifact-path: build/bin/*.app
            build-flags: ''
          - os: ubuntu-22.04
            artifact-name: espaze-linux
            artifact-path: build/bin/espaze
            build-flags: ''

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # windows-latest ships NSIS preinstalled, so -nsis (producing an
      # installer alongside the raw .exe) needs no extra setup here.
      - name: Build
        run: wails build ${{ matrix.build-flags }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
